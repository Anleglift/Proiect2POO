
name: C++ CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [g++, clang++]

    steps:
    - uses: actions/checkout@v3

    - name: Install compilers (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y g++ clang

    - name: Compile
      run: |
        ${{ matrix.compiler }} -Wall -Wextra -Werror -std=c++17 main.cpp -o program

    - name: Run
      shell: bash
      run: ./program